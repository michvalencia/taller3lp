{% extends "base.html" %}

{% block content %}
<div class="row mt-4 justify-content-center">
    <div class="col-md-8">
        <h2 class="fw-bold mb-4">Categorías de la Tienda</h2>
        <div class="list-group shadow-sm">
            {% for cat in categorias %}
            <a href="{{ url_for('main.index', categoria=cat.id) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
                <span class="fw-bold fs-5">{{ cat.nombre }}</span>
                <span class="badge bg-primary rounded-pill fs-6">{{ cat.productos|length }} productos</span>
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
