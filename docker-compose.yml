version: '3.8'

services:
  database:
    image: postgres:15
    container_name: lp2taller3-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-tienda}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usuario} -d ${POSTGRES_DB:-tienda}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: lp2taller3-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-usuario}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-tienda}
    depends_on:
      database:
        condition: service_healthy

  web:
    build: ./web
    container_name: lp2taller3-web
    ports:
      - "5000:5000"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
